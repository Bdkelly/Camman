[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ball-tracking-system"
version = "0.2.0"
description = "Camman ball tracking application and model training tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "opencv-python-headless>=4.8,<5",
    "Pillow>=10,<13",
    "pyserial>=3.5,<4",
    "bleak>=0.21,<4",
]

[project.optional-dependencies]
frontend = ["PyQt5>=5.15,<6"]
training = ["albumentations>=1.4,<3"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pytest-mock>=3.12,<4", "pytest-cov>=5,<8", "build>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
camman = "frontend.app:main"
camman-benchmark = "backend.tools.benchmark:main"
camman-track = "backend.tools.track:main"
camman-train = "training.detection.train:main"
camman-train-agent = "training.reinforcement.train:main"
camman-cache-tracks = "training.reinforcement.tracks:main"
camman-evaluate-agent = "training.reinforcement.evaluate:main"
camman-clean = "training.data.clean:main"
camman-annotate = "training.data.auto_annotate:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["frontend*", "backend*", "training*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = false

[tool.setuptools.package-data]
backend = ["firmware/*.cpp", "firmware/README.md", "firmware/controller/platformio.ini", "firmware/controller/include/*.h", "firmware/controller/src/*.cpp", "firmware/controller/README.md", "JETSON.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
